name: Push Workflow

on:
  push:
    branches:
      - main

jobs:
  job1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print message
        run: echo "Push triggered!"

      - name: Print name
        run: echo "Rashi"

  job2:
    runs-on: ubuntu-latest
    needs: job1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Second job message
        run: echo "Job 2 running after Job 1"