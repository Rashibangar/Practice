name: Artifact 

on:
  push:

jobs:

  job1:
    runs-on: ubuntu-latest

    steps:
      - name: Create file
        run: echo "Hello from Job 1 (Rashi)" > file.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-file
          path: file.txt


  job2:
    runs-on: ubuntu-latest
    needs: job1   

    steps:
      - name: Download file
        uses: actions/download-artifact@v4
        with:
          name: my-file

      - name: Print file content
        run: cat file.txt 